plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'maven-publish'
}

version = project.findProperty('mod_version') ?: '1.0.0'

def mcVersion = project.findProperty('minecraft_version') ?: '1.21.1'
def forgeVersion = project.findProperty('forge_version') ?: '52.1.0'

// Minecraft 1.20.5+ is compiled against Java 21; earlier releases use Java 17.
// Of the versions built here that means 1.20.1 -> 17 and 1.21.1 -> 21.
def javaVersion = (project.findProperty('java_version')
    ?: (mcVersion.startsWith('1.20') ? '17' : '21')).toString().toInteger()

base {
    archivesName = "weatherrythme-forge-${mcVersion}"
}

repositories {
    maven { url = 'https://maven.minecraftforge.net' }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${mcVersion}-${forgeVersion}"
}

minecraft {
    mappings channel: 'official', version: mcVersion
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(javaVersion) }
    withSourcesJar()
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : 'WeatherRythme',
            'Specification-Vendor'    : 'Mills520',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.version
        ])
    }
}
