name: build-jars

on:
  workflow_dispatch:
  push:
    branches: ["main", "master", "work"]
  pull_request:

jobs:
  # Minecraft 1.20.5+ is compiled against Java 21, so the Fabric target needs a
  # different JDK from the Forge target. They are separate jobs for that reason.
  fabric:
    name: Fabric ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: "1.21.1"
            fabric_api: "0.115.1+1.21.1"
            fabric_loader: "0.16.10"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build Fabric (${{ matrix.mc }})
        run: |
          gradle -p fabric clean build \
            -Pminecraft_version=${{ matrix.mc }} \
            -Pfabric_loader_version=${{ matrix.fabric_loader }} \
            -Pfabric_api_version=${{ matrix.fabric_api }}

      - name: Stage artifacts
        run: |
          mkdir -p dist/fabric/${{ matrix.mc }}
          cp fabric/build/libs/*.jar dist/fabric/${{ matrix.mc }}/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weatherrythme-fabric-${{ matrix.mc }}
          path: dist/
          if-no-files-found: error

  # 1.20.1 is the last Minecraft version with a stable MinecraftForge release
  # line; newer versions moved to NeoForge.
  forge:
    name: Forge ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: "1.20.1"
            forge: "47.3.0"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build Forge (${{ matrix.mc }})
        run: |
          gradle -p forge clean build \
            -Pminecraft_version=${{ matrix.mc }} \
            -Pforge_version=${{ matrix.forge }}

      - name: Stage artifacts
        run: |
          mkdir -p dist/forge/${{ matrix.mc }}
          cp forge/build/libs/*.jar dist/forge/${{ matrix.mc }}/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weatherrythme-forge-${{ matrix.mc }}
          path: dist/
          if-no-files-found: error

  script:
    name: build_all.sh syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell script syntax
        run: bash -n scripts/build_all.sh
