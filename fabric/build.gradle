buildscript {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'net.fabricmc:fabric-loom:1.7.4'
    }
}

apply plugin: 'fabric-loom'
apply plugin: 'maven-publish'

version = project.findProperty('mod_version') ?: '1.0.0'

def mcVersion = project.findProperty('minecraft_version') ?: '1.21.1'
def loaderVersion = project.findProperty('fabric_loader_version') ?: '0.16.10'
def fabricApiVersion = project.findProperty('fabric_api_version') ?: '0.115.1+1.21.1'

base {
    archivesName = "weatherrythme-fabric-${mcVersion}"
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${mcVersion}"
    // Official Mojang mappings: the mod sources are written against Mojang names
    // (ServerLevel, setWeatherParameters, ...) so both loaders share one vocabulary
    // and there is no Yarn build number to keep pinned.
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loaderVersion}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
}

java {
    // Minecraft 1.20.5+ (this includes 1.21.1) is compiled against Java 21.
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
    withSourcesJar()
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}
